<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 70" width="800" height="70">
  <style>
    .base   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 700; }
    .plain  { fill: #24292f; }
    .bright { fill: #1B4F8A; }
    .dim    { fill: #1B4F8A; fill-opacity: 0.4; }
    @media (prefers-color-scheme: dark) {
      .plain  { fill: #e6edf3; }
      .bright { fill: #58A6FF; }
      .dim    { fill: #58A6FF; fill-opacity: 0.4; }
    }
  </style>
  <text x="400" y="48" text-anchor="middle" class="base"><tspan class="plain">Hi, I'm </tspan><tspan class="bright">Bhal</tspan><tspan class="dim">chandra</tspan><tspan class="bright"> Shinde</tspan><tspan class="plain"> 👋</tspan></text>
</svg>
